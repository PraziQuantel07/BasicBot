# .gitlab-ci.yml

stages:
  - build

build-windows-exe:
  stage: build
  image: python:3.10-windowsservercore-ltsc2022
  tags:
    - windows
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install pyinstaller pynput pyautogui

  script:
    - pyinstaller --onefile --windowed BasicBot.py

  artifacts:
    paths:
      - dist/BasicBot.exe
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
