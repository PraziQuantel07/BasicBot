name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller pynput pyautogui

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed BasicBot.py

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: BasicBot.exe
          path: dist/BasicBot.exe
